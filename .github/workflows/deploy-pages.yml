name: Deploy curriculum preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build curriculum preview
        run: npm run build --workspace frontend
        env:
          GITHUB_PAGES: "true"

      - name: Add SPA route fallback
        run: cp frontend/dist/index.html frontend/dist/404.html

      - name: Publish to GitHub Pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          publish_branch: gh-pages
          force_orphan: true

      - name: Configure GitHub Pages source
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const source = { branch: "gh-pages", path: "/" };

            try {
              await github.rest.repos.getPages({ owner, repo });
              await github.rest.repos.updateInformationAboutPagesSite({
                owner,
                repo,
                source,
              });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              await github.rest.repos.createPagesSite({
                owner,
                repo,
                source,
              });
            }
