services:
  - type: web
    name: learnhub-lms-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci
    startCommand: npm run start --workspace backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
